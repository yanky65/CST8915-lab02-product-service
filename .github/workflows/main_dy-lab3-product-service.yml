# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - dy-lab3-product-service

on:
  push:
    branches:
      - midterm-project
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python dependencies
        working-directory: product-service
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Deploy only Python application files at the ZIP root. Exclude the
      # virtual environment, Rust sources, Node.js manifests, and local secrets.
      # App Service installs dependencies with SCM_DO_BUILD_DURING_DEPLOYMENT=true.
      - name: Package product service
        working-directory: product-service
        run: |
          zip "$GITHUB_WORKSPACE/product-service.zip" \
            app.py requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: product-service.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'product-service-mp'
          slot-name: 'Production'
          package: product-service.zip
